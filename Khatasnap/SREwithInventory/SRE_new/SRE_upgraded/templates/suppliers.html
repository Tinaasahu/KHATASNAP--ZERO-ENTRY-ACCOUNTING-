<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhataSnap – Suppliers</title>
<link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo"><div class="brand">🧾 KhataSnap</div><div class="sub">Inventory · Finals</div></div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <a href="/" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
    <a href="/products" class="nav-item"><span class="nav-icon">📦</span><span>Products</span></a>
    <a href="/stock" class="nav-item"><span class="nav-icon">🔄</span><span>Stock</span></a>
    <a href="/low-stock" class="nav-item"><span class="nav-icon">⚠️</span><span>Low Stock</span></a>
    <a href="/history" class="nav-item"><span class="nav-icon">📋</span><span>History</span></a>
  </div>
  <div class="nav-section">
    <div class="nav-label">Setup</div>
    <a href="/categories" class="nav-item"><span class="nav-icon">🏷️</span><span>Categories</span></a>
    <a href="/suppliers" class="nav-item"><span class="nav-icon">🚚</span><span>Suppliers</span></a>
    <a href="/test" class="nav-item"><span class="nav-icon">🧪</span><span>API Test</span></a>
    <a href="/sre" class="nav-item"><span class="nav-icon">🔁</span><span>SRE Console</span></a>
    <a href="/sre/smart" class="nav-item nav-item-smart"><span class="nav-icon">🧠</span><span>Smart SRE</span></a>
  </div>
  <div class="sidebar-bottom"><div class="server-status"><span class="sdot" id="sdot"></span><span id="slabel">Connecting…</span></div></div>
</nav>

<div class="main">
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div class="page-title">Suppliers · आपूर्तिकर्ता</div>
      <div class="page-sub">Manage your suppliers</div>
    </div>
    <button class="btn btn-primary" onclick="openAdd()">➕ Add Supplier</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead>
        <tbody id="supTable"></tbody>
      </table>
      <div class="empty hidden" id="emptyMsg"><div class="empty-icon">🚚</div><p>No suppliers added yet</p></div>
    </div>
  </div>
</div>

<div class="overlay" id="supModal">
  <div class="modal" style="width:440px">
    <div class="modal-header">
      <span class="modal-title" id="supModalTitle">➕ Add Supplier</span>
      <button class="modal-close" onclick="close_('supModal')">✕</button>
    </div>
    <div class="form-grid">
      <div class="fg"><label>Supplier Name * · नाम</label><input id="supName" placeholder="e.g. Raj Distributors"></div>
      <div class="fg"><label>Phone · फोन</label><input id="supPhone" placeholder="e.g. 9876543210"></div>
      <div class="fg"><label>Address · पता</label><textarea id="supAddress" placeholder="Full address…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="close_('supModal')">Cancel</button>
      <button class="btn btn-primary btn-submit" onclick="saveSup()">💾 Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/app.js"></script>
<script>
let suppliers = []; let editSupId = null;

async function load() {
  suppliers = await apiFetch('/suppliers');
  if (!suppliers) return;
  const tbody = document.getElementById('supTable');
  document.getElementById('emptyMsg').classList.toggle('hidden', suppliers.length > 0);
  tbody.innerHTML = suppliers.map(s => `
    <tr>
      <td><b>${x(s.name)}</b></td>
      <td class="mono">${x(s.phone||'—')}</td>
      <td style="font-size:12px;color:var(--muted)">${x(s.address||'—')}</td>
      <td><div style="display:flex;gap:6px">
        <button class="ibtn" onclick="editSup(${s.id})">✏️</button>
        <button class="ibtn del" onclick="deleteSup(${s.id})">🗑️</button>
      </div></td>
    </tr>`).join('');
}

function openAdd() {
  editSupId = null;
  document.getElementById('supModalTitle').textContent = '➕ Add Supplier';
  ['supName','supPhone','supAddress'].forEach(id => document.getElementById(id).value = '');
  open_('supModal');
}

function editSup(id) {
  const s = suppliers.find(s => s.id === id);
  if (!s) return;
  editSupId = id;
  document.getElementById('supModalTitle').textContent = '✏️ Edit Supplier';
  document.getElementById('supName').value    = s.name;
  document.getElementById('supPhone').value   = s.phone || '';
  document.getElementById('supAddress').value = s.address || '';
  open_('supModal');
}

async function saveSup() {
  const name = document.getElementById('supName').value.trim();
  if (!name) return toast('Name required', 'err');
  const payload = { name, phone: document.getElementById('supPhone').value, address: document.getElementById('supAddress').value };
  const url    = editSupId ? `/suppliers/${editSupId}` : '/suppliers';
  const method = editSupId ? 'PUT' : 'POST';
  const res    = await apiFetch(url, { method, body: JSON.stringify(payload) });
  if (res) { toast(editSupId ? 'Updated ✓' : 'Added ✓', 'ok'); close_('supModal'); load(); }
}

async function deleteSup(id) {
  if (!confirm('Delete this supplier?')) return;
  const res = await apiFetch(`/suppliers/${id}`, { method: 'DELETE' });
  if (res) { toast('Deleted', 'info'); load(); }
}

load();
</script>
</body>
</html>
